name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release-channel: ${{ steps.release-channel.outputs.channel }}
      release-title: ${{ steps.release-channel.outputs.title }}
      release-prerelease: ${{ steps.release-channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run dependency:audit
      - run: npm run check
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:contract -- --tag "$RELEASE_TAG"
      - name: Validate release channel
        id: release-channel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_notes_file=".github/release-notes/${RELEASE_TAG}.md"
          channel_resolution="$(node scripts/release-channel.mjs "$release_notes_file" "$RELEASE_TAG")"
          IFS=$'\t' read -r channel title prerelease <<<"$channel_resolution"
          {
            echo "channel=$channel"
            echo "title=$title"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - run: npm run verify:reproducible
      - name: Validate verified release candidate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:contract -- --tag "$RELEASE_TAG"
      - name: Validate release candidate files
        run: |
          set -euo pipefail
          for release_file in main.js manifest.json styles.css; do
            if [[ ! -f "$release_file" ]]; then
              echo "Release candidate file ${release_file} is missing or not a regular file." >&2
              exit 1
            fi
          done
      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: release-candidate
      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-candidate/main.js
            release-candidate/manifest.json
            release-candidate/styles.css
      - name: Verify remote release tag revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! remote_refs="$(git ls-remote --exit-code --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")"; then
            echo "Remote release tag refs/tags/${TAG} does not exist." >&2
            exit 1
          fi
          remote_commit="$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<<"$remote_refs")"
          if [[ -z "$remote_commit" ]]; then
            remote_commit="$(awk -v expected_ref="refs/tags/${TAG}" '$2 == expected_ref { print $1 }' <<<"$remote_refs")"
          fi
          if [[ -z "$remote_commit" ]]; then
            echo "Remote release tag refs/tags/${TAG} could not be resolved to a commit." >&2
            exit 1
          fi
          if [[ "$remote_commit" != "$EXPECTED_SHA" ]]; then
            echo "Remote release tag refs/tags/${TAG} resolves to ${remote_commit}; expected original workflow SHA ${EXPECTED_SHA}." >&2
            exit 1
          fi
          echo "Remote release tag refs/tags/${TAG} resolves to original workflow SHA ${EXPECTED_SHA}."
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          RELEASE_CHANNEL: ${{ needs.build.outputs.release-channel }}
          RELEASE_TITLE: ${{ needs.build.outputs.release-title }}
          RELEASE_PRERELEASE: ${{ needs.build.outputs.release-prerelease }}
        run: |
          set -euo pipefail
          echo "Publishing validated ${RELEASE_CHANNEL} release ${TAG}."
          release_notes_file=".github/release-notes/${TAG}.md"
          release_args=(
            "$TAG"
            --verify-tag
            --title "$RELEASE_TITLE"
            --generate-notes
          )
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          if [[ -f "$release_notes_file" ]]; then
            release_args+=(--notes "$(cat "$release_notes_file")")
          fi
          gh release create "${release_args[@]}" release-candidate/main.js release-candidate/manifest.json release-candidate/styles.css
